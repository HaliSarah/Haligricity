<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Haligric Practice Finder</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Cinzel:wght@400;600&family=EB+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --deep:    #0e0e1a;
    --mid:     #16162a;
    --panel:   #1a1a30;
    --border:  #3a3060;
    --gold:    #c9a227;
    --gold2:   #e8c455;
    --rose:    #8b3a5a;
    --sage:    #2a5a3a;
    --sage2:   #3a7a50;
    --violet:  #5b2d80;
    --cream:   #f5f0e8;
    --mist:    rgba(201,162,39,0.08);
    --glow:    0 0 40px rgba(201,162,39,0.15);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--deep);
    color: var(--cream);
    font-family: 'Cormorant Garamond', serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  #stars {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background: radial-gradient(ellipse at 20% 30%, #1a1030 0%, transparent 60%),
                radial-gradient(ellipse at 80% 70%, #0a0a20 0%, transparent 60%),
                var(--deep);
  }
  #stars::before, #stars::after {
    content: '';
    position: absolute; inset: 0;
    background-image:
      radial-gradient(1px 1px at 15% 20%, rgba(255,255,255,0.6) 0%, transparent 100%),
      radial-gradient(1px 1px at 45% 8%,  rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 72% 35%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 90% 15%, rgba(255,255,255,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 5%  60%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 60% 75%, rgba(255,255,255,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 30% 88%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 85% 82%, rgba(201,162,39,0.4) 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 22% 50%, rgba(201,162,39,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 55% 48%, rgba(255,255,255,0.4) 0%, transparent 100%);
  }
  #stars::after {
    background-image:
      radial-gradient(1px 1px at 8%  10%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 35% 30%, rgba(255,255,255,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 68% 55%, rgba(255,255,255,0.6) 0%, transparent 100%),
      radial-gradient(1px 1px at 92% 40%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 18% 70%, rgba(255,255,255,0.3) 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 50% 92%, rgba(201,162,39,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 77% 25%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 42% 62%, rgba(255,255,255,0.3) 0%, transparent 100%);
    animation: twinkle 4s ease-in-out infinite alternate;
  }
  @keyframes twinkle { from { opacity: 0.6; } to { opacity: 1; } }

  #app {
    position: relative; z-index: 1;
    max-width: 780px;
    margin: 0 auto;
    padding: 60px 24px 80px;
    min-height: 100vh;
  }

  .site-header { text-align: center; margin-bottom: 48px; animation: fadeDown 1s ease both; }
  .symbol { width: 72px; height: 72px; margin: 0 auto 20px; position: relative; }
  .symbol img { width:100%; height:100%; object-fit:contain; filter: drop-shadow(0 0 12px rgba(201,162,39,0.5)); }
  .site-header h1 {
    font-family: 'Cinzel', serif; font-size: clamp(1.4rem, 4vw, 2rem); font-weight: 400;
    letter-spacing: 0.12em; color: var(--gold); margin-bottom: 10px;
  }
  .site-header .subtitle { font-size: 1.05rem; font-style: italic; color: rgba(245,240,232,0.6); letter-spacing: 0.04em; }

  .progress-wrap { margin-bottom: 36px; animation: fadeDown 1s 0.2s ease both; }
  .progress-label {
    display: flex; justify-content: space-between; font-size: 0.8rem;
    color: rgba(245,240,232,0.45); letter-spacing: 0.08em; text-transform: uppercase;
    font-family: 'Cinzel', serif; margin-bottom: 10px;
  }
  .progress-track { height: 2px; background: rgba(255,255,255,0.08); border-radius: 2px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--rose), var(--gold)); border-radius: 2px; transition: width 0.6s cubic-bezier(.4,0,.2,1); }

  .question-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 16px;
    padding: 40px 36px; box-shadow: var(--glow), inset 0 1px 0 rgba(255,255,255,0.04);
    position: relative; overflow: hidden;
  }
  .question-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent); opacity: 0.4;
  }
  .q-eyebrow {
    font-family:'Cinzel',serif; font-size:.66rem; letter-spacing:.18em; text-transform:uppercase;
    color: var(--rose); margin-bottom: 10px; opacity:.85;
  }
  .q-text { font-size: clamp(1.15rem, 2.5vw, 1.45rem); font-weight: 300; line-height: 1.55; color: var(--cream); margin-bottom: 8px; }
  .q-sub { font-size: 0.9rem; font-style: italic; color: rgba(245,240,232,0.5); margin-bottom: 28px; line-height: 1.5; }

  .options { display: grid; gap: 12px; }
  .option-btn {
    background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px;
    padding: 16px 20px; cursor: pointer; text-align: left; color: var(--cream);
    font-family: 'Cormorant Garamond', serif; font-size: 1rem; line-height: 1.45;
    transition: all 0.25s ease; position: relative; overflow: hidden;
  }
  .option-btn::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--gold);
    transform: scaleY(0); transition: transform 0.25s ease; border-radius: 0 2px 2px 0;
  }
  .option-btn:hover { background: rgba(201,162,39,0.08); border-color: rgba(201,162,39,0.3); transform: translateX(4px); }
  .option-btn:hover::before { transform: scaleY(1); }
  .option-btn .opt-note { display:block; font-size:.82rem; font-style:italic; color:rgba(245,240,232,0.45); margin-top:4px; }

  .nav-row { display: flex; justify-content: space-between; align-items: center; margin-top: 30px; gap: 16px; }
  .btn-back {
    background: transparent; border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; padding: 12px 24px;
    color: rgba(245,240,232,0.5); font-family: 'Cinzel', serif; font-size: 0.78rem; letter-spacing: 0.1em;
    cursor: pointer; transition: all 0.2s;
  }
  .btn-back:hover { border-color: rgba(255,255,255,0.3); color: var(--cream); }
  .btn-next, .btn-continue {
    background: linear-gradient(135deg, var(--rose) 0%, var(--gold) 100%); border: none; border-radius: 8px;
    padding: 14px 30px; color: #fff; font-family: 'Cinzel', serif; font-size: 0.78rem; letter-spacing: 0.1em;
    cursor: pointer; transition: all 0.25s; box-shadow: 0 4px 20px rgba(139,58,90,0.3); text-align: center;
  }
  .btn-next:hover, .btn-continue:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(139,58,90,0.4); }

  .fade-in  { animation: fadeIn  0.5s ease both; }
  .fade-out { animation: fadeOut 0.35s ease both; }
  @keyframes fadeIn  { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
  @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; transform: translateY(-12px); } }
  @keyframes fadeDown { from { opacity: 0; transform: translateY(-16px); } to { opacity: 1; transform: none; } }

  #loading { display: none; text-align: center; padding: 60px 0; }
  .spinner { width: 56px; height: 56px; margin: 0 auto 24px; border: 2px solid rgba(201,162,39,0.2); border-top-color: var(--gold); border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { font-style: italic; color: rgba(245,240,232,0.5); font-size: 1rem; }

  #result { display: none; }
  .result-header { text-align: center; margin-bottom: 36px; }
  .result-header .ashe {
    font-family: 'Cinzel', serif; font-size: 0.8rem; letter-spacing: 0.2em; color: var(--gold);
    text-transform: uppercase; margin-bottom: 12px; opacity: 0.7;
  }
  .result-header h2 { font-size: clamp(1.5rem, 4vw, 2.2rem); font-weight: 300; color: var(--cream); line-height: 1.3; margin-bottom: 8px; }
  .result-header .archetype { font-size: 1.05rem; font-style: italic; color: var(--gold); }

  .result-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 32px;
    margin-bottom: 20px; box-shadow: var(--glow); position: relative; overflow: hidden;
  }
  .result-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent); opacity: 0.4;
  }
  .result-card h3 {
    font-family: 'Cinzel', serif; font-size: 0.75rem; letter-spacing: 0.15em; color: var(--gold);
    text-transform: uppercase; margin-bottom: 14px; opacity: 0.8;
  }
  .result-card p.lead { font-size:.98rem; line-height:1.75; color:rgba(245,240,232,0.8); margin-bottom:14px; }
  .result-card p.lead:last-child { margin-bottom:0; }

  .practice-list { display: grid; gap: 8px; }
  .practice-item {
    display:flex; align-items:center; gap:14px; padding:14px 16px; border-radius:10px;
    background:rgba(255,255,255,0.03); border:1px solid rgba(201,162,39,0.12);
    cursor:pointer; transition:background .2s;
  }
  .practice-item:hover { background:rgba(201,162,39,0.07); }
  .practice-item.open  { background:rgba(201,162,39,0.05); border-color:rgba(201,162,39,0.3); }
  .p-icon { font-size:1.4rem; flex-shrink:0; }
  .p-info { flex:1; min-width:0; }
  .p-name { font-family:'Cinzel',serif; font-size:.8rem; letter-spacing:.05em; text-transform:uppercase; color:var(--gold); }
  .p-detail { font-size:.88rem; color:rgba(245,240,232,0.68); line-height:1.65; margin-top:8px; display:none; white-space:pre-line; }
  .practice-item.open .p-detail { display:block; }
  .p-right { display:flex; flex-direction:column; align-items:flex-end; gap:6px; flex-shrink:0; }
  .p-badge { font-size:.6rem; padding:3px 9px; border-radius:20px; font-family:'Cinzel',serif; letter-spacing:.08em; text-transform:uppercase; white-space:nowrap; }
  .badge-rise   { background: rgba(201,162,39,0.15); color: var(--gold); border: 1px solid rgba(201,162,39,0.3); }
  .badge-daily  { background: rgba(42,90,58,0.2);   color: #6abf85;     border: 1px solid rgba(42,90,58,0.4); }
  .badge-weekly { background: rgba(91,45,128,0.2);  color: #a87ad8;     border: 1px solid rgba(91,45,128,0.3); }
  .badge-eve    { background: rgba(139,58,90,0.2);  color: #d87aab;     border: 1px solid rgba(139,58,90,0.3); }
  .badge-altar  { background: rgba(200,90,40,0.18); color: #e8a468;     border: 1px solid rgba(200,90,40,0.35); }
  .p-arrow { font-size:.7rem; color:rgba(201,162,39,0.5); transition:transform .2s; }
  .practice-item.open .p-arrow { transform:rotate(180deg); }

  .vares-card {
    background:rgba(201,162,39,0.05); border:1px solid rgba(201,162,39,0.25); border-radius:14px;
    padding: 22px; margin-bottom: 16px; text-align:center;
  }
  .vares-card img { max-width: 220px; width:100%; border-radius: 10px; border:1px solid rgba(201,162,39,0.3); margin-bottom:14px; }
  .vares-card .say {
    font-size: 1.2rem; font-style: italic; color: var(--cream); line-height: 1.6; margin-bottom: 14px;
  }
  .vares-actions { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  .vares-actions a {
    font-family:'Cinzel',serif; font-size:.72rem; letter-spacing:.1em; text-transform:uppercase;
    padding: 10px 18px; border-radius: 8px; text-decoration:none; transition: all .2s;
  }
  .vares-actions a.solid { background: var(--gold); color: #1a1a10; }
  .vares-actions a.solid:hover { background: var(--gold2); }
  .vares-actions a.outline { border: 1px solid var(--gold); color: var(--gold); }
  .vares-actions a.outline:hover { background: rgba(201,162,39,0.1); }

  .tip-card {
    background: rgba(255,255,255,0.03); border: 1px dashed rgba(201,162,39,0.3); border-radius: 12px;
    padding: 16px 20px; margin-top: 14px; font-size: .88rem; line-height: 1.65; color: rgba(245,240,232,0.65); font-style: italic;
  }

  .link-grid { display:grid; gap:8px; margin-top: 6px; }
  .link-row { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:10px 14px; background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.08); border-radius:8px; }
  .link-row span { font-size:.9rem; color: var(--cream); }
  .link-row .link-btns { display:flex; gap:8px; flex-wrap:wrap; }
  .link-row a { font-family:'Cinzel',serif; font-size:.66rem; letter-spacing:.08em; text-transform:uppercase; color: var(--gold); text-decoration:none; border-bottom: 1px dotted rgba(201,162,39,0.5); padding-bottom:1px; }
  .link-row a:hover { color: var(--gold2); }

  .retake-row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-top: 32px; }
  .btn-retake {
    background: transparent; border: 1px solid var(--gold); border-radius: 8px; padding: 13px 28px; color: var(--gold);
    font-family: 'Cinzel', serif; font-size: 0.78rem; letter-spacing: 0.1em; cursor: pointer; transition: all 0.25s;
  }
  .btn-retake:hover { background: rgba(201,162,39,0.1); transform: translateY(-2px); }

  .footer-note { text-align: center; margin-top: 44px; font-size: 0.85rem; font-style: italic; color: rgba(245,240,232,0.3); line-height: 1.7; }
  .footer-note strong { color: rgba(201,162,39,0.6); font-style: normal; }

  @media (max-width: 520px) {
    #app { padding: 40px 16px 60px; }
    .question-card { padding: 26px 20px; }
    .result-card { padding: 22px 18px; }
    .nav-row { flex-wrap: wrap; }
  }
</style>

<div id="stars"></div>

<div id="app">

    <p class="loading-text">Reading the field of your answers…</p>

   PRACTICE LIBRARY (reused/expanded from the daily practice pages)

/* ══════════════════════════════════════════════════════════════
   RENDER — question steps
   ══════════════════════════════════════════════════════════════ */
function totalStepsEstimate() {
  // rough progress denominator depending on path
  if (answers.time === "5") return 2;
  if (answers.time === "15") return 1;
  let n = 6; // connect, religion, energy, tension, calling, result
  if (answers.calling === "grief") n += 1;
  if (answers.grief_what === "person") n += 1;
  return n;
}

function stepIndexEstimate() {
  return historyStack.length + 1;
}

function renderQuestion(stepId) {
  const step = steps[stepId];
  const card = document.getElementById("questionCard");
  document.getElementById("quizArea").style.display = "block";
  document.getElementById("progressWrap").style.display = "block";
  document.getElementById("result").style.display = "none";
  document.getElementById("loading").style.display = "none";

  card.classList.remove("fade-in");
  card.classList.add("fade-out");

  setTimeout(() => {
    document.getElementById("qEyebrow").textContent = step.eyebrow || "";
    document.getElementById("qText").textContent = step.text;
    document.getElementById("qSub").textContent = step.sub || "";

    const optArea = document.getElementById("options");
    optArea.innerHTML = "";
    step.options.forEach(opt => {
      const btn = document.createElement("button");
      btn.className = "option-btn";
      btn.innerHTML = opt.t + (opt.note ? `<span class="opt-note">${opt.note}</span>` : "");
      btn.onclick = () => choose(stepId, opt.v);
      optArea.appendChild(btn);
    });

    document.getElementById("btnBack").style.visibility = historyStack.length === 0 ? "hidden" : "visible";

    const idx = stepIndexEstimate();
    const total = Math.max(totalStepsEstimate(), idx);
    const pct = Math.min(95, Math.round((idx / (total + 1)) * 100));
    document.getElementById("progressFill").style.width = pct + "%";
    document.getElementById("stepLabel").textContent = step.eyebrow || "Question";
    document.getElementById("pctLabel").textContent = pct + "%";

    card.classList.remove("fade-out");
    card.classList.add("fade-in");
  }, 280);
}

function choose(stepId, value) {
  answers[stepId] = value;
  historyStack.push(stepId);
  const next = steps[stepId].next(value, answers);
  current = next;
  if (next.startsWith("result_")) {
    showResultScreen(next);
  } else {
    renderQuestion(next);
  }
}

function goBack() {
  if (historyStack.length === 0) return;
  const prev = historyStack.pop();
  delete answers[prev];
  current = prev;
  renderQuestion(prev);
}

function restartQuiz() {
  Object.keys(answers).forEach(k => delete answers[k]);
  historyStack = [];
  current = "time";
  document.getElementById("result").style.display = "none";
  renderQuestion("time");
}

function continueToFullQuiz() {
  // used from the quick 5-min / 15-min result screens
  historyStack.push(current);
  current = "connect";
  renderQuestion("connect");
}

function showResultScreen(kind) {
  document.getElementById("quizArea").style.display = "none";
  document.getElementById("progressWrap").style.display = "none";
  document.getElementById("loading").style.display = "block";

  setTimeout(() => {
    document.getElementById("loading").style.display = "none";
    const el = document.getElementById("result");
    if (kind === "result_single") el.innerHTML = renderSingleResult();
    else if (kind === "result_meal") el.innerHTML = renderMealResult();
    else el.innerHTML = renderFullResult();
    el.style.display = "block";
    el.classList.add("fade-in");
    window.scrollTo({top:0, behavior:"smooth"});
  }, 1400);
}

    dailySet = ["bhramari"];
    weeklySet = ["space_clear"];
  }

  // ---- lead practice by "connect" answer ----
  const connectLead = {
    movement: ["qigong_rise","yoga_rise","yoga_eve"],
    nature: ["earthing"],
    creative: ["creative"],
    prayer_ritual: [],
    journaling: ["dream_journal","gratitude_list","day_reflection"],
    stillness: ["bhramari","three_chamber"],
    sound_music: ["singing_bowl_rise","singing_bowl_eve","tuning_fork"],
    nothing_yet: []
  };
  (connectLead[connect] || []).forEach(k => { if (!riseSet.includes(k) && !eveSet.includes(k) && !dailySet.includes(k)) dailySet.unshift(k); });

  // dedup
  const dedup = arr => [...new Set(arr)];
  riseSet = dedup(riseSet); eveSet = dedup(eveSet); dailySet = dedup(dailySet); weeklySet = dedup(weeklySet);

  // ---- calling-based special section ----
  let callingHTML = "";
  let callingTitle = "";
  if (calling === "self_love") {
    callingTitle = "What's Calling You — Self-Love";
    callingHTML = `<p class="lead">Self-love isn't a mood — it's a relationship you tend on purpose. The practice built specifically for this is the <strong>Altar of the Selves</strong>: a way of actively loving every version of yourself that got you here.</p>
    <div class="practice-list">${practiceItems(["altar_of_selves"])}</div>`;
  } else if (calling === "life_purpose") {
    callingTitle = "What's Calling You — A Foggy Sense of Purpose";
    callingHTML = `<p class="lead">Feeling foggy about life purpose is very often self-love wearing a different name — it's hard to see a clear path forward when the relationship with your own past selves is unresolved. The recommendation here is the same: the <strong>Altar of the Selves</strong>.</p>
    <div class="practice-list">${practiceItems(["altar_of_selves"])}</div>`;
  } else if (calling === "grief") {
    const what = answers.grief_what;
    const who = answers.grief_who;
    callingTitle = "What's Calling You — Grief";
    let altarKeys = [];
    let note = "";
    if (what === "animal") {
      altarKeys = ["pet_altar"];
      note = "Grief for an animal companion is a full grief, not a lesser one.";
    } else if (what === "thing") {
      altarKeys = ["altar_of_the_living"];
      note = "Loss doesn't have to mean death to deserve a tended space — a job, a home, a chapter, or a version of a relationship all qualify.";
    } else if (who === "relative") {
      altarKeys = ["ancestor_altar"];
      note = "This can take time to feel ready for — sometimes months. There is no timeline that is too long.";
    } else if (who === "friend") {
      altarKeys = ["ancestor_altar"];
      note = "This practice is not reserved for blood relatives. A close friend belongs here just as fully.";
    } else if (who === "public") {
      altarKeys = ["acquaintance_altar"];
      note = "Grief for someone you didn't know personally, or for a public tragedy, is documented to leave real effects — it doesn't need to be justified.";
    } else {
      altarKeys = ["altar_of_the_living"];
    }
    callingHTML = `<p class="lead">Every tear brings you closer to healing, even when it doesn't feel like it in the moment. ${note}</p>
    <div class="practice-list">${practiceItems(altarKeys)}</div>
    <p class="lead" style="margin-top:14px;">Bring the <strong>Soul Retrieval Varessence</strong> into these visits — spoken at the rise, or at the close of any altar visit or emotional experience:</p>
    ${varesCard(VARESSENCE.soul_retrieval)}`;
  } else if (calling === "transition") {
    callingTitle = "What's Calling You — A Season in Transition";
    callingHTML = `<p class="lead">Transitions are held well by the moon cycle and by the Altar of the Selves — a place to actively honor who you're becoming as you leave a version of yourself behind.</p>
    <div class="practice-list">${practiceItems(["new_moon","full_moon","altar_of_selves"])}</div>`;
  } else {
    callingTitle = "What's Calling You — Grounding and Balance";
    callingHTML = `<p class="lead">A steady daily rhythm is its own form of medicine. Lean on the Zenith earthing practice and a simple evening reflection to keep the nervous system on an even keel.</p>
    <div class="practice-list">${practiceItems(["earthing","gratitude_list"])}</div>`;
  }

  const religionNote = RELIGION_NOTE[religion] || "";

  return `
    <div class="result-header">
      <div class="ashe">Your Haligric Path</div>
      <h2>${time === "30" ? "The Full Daily Arc" : "A Flexible Daily Arc"}</h2>
      <div class="archetype">Built from where you actually are, not where you think you should be.</div>
      <a class="btn-continue" style="display:inline-block;text-decoration:none;margin-top:18px;" href="https://Haligricity.IQProductionz.com/Energy/Zodiac/DayEnergy/">See Today's Energetic Influence</a>
    </div>

    ${callingTitle ? `<div class="result-card">
      <h3>${callingTitle}</h3>
      ${callingHTML}
    </div>` : ""}

    ${religionNote ? `<div class="result-card" style="background:rgba(201,162,39,0.04); border-color:rgba(201,162,39,0.2);">
      <h3>A Point of Connection</h3>
      <p class="lead">${religionNote}</p>
    </div>` : ""}

    <div class="result-card">
      <h3>Rising — ${time === "30" ? "Full Sequence" : "Essential Core"}</h3>
      <div class="practice-list">${practiceItems(riseSet)}</div>
      ${varesCard(VARESSENCE.rising)}
    </div>

    ${dailySet.length ? `<div class="result-card">
      <h3>Throughout the Day</h3>
      <div class="practice-list">${practiceItems(dailySet)}</div>
    </div>` : ""}

    <div class="result-card">
      <h3>Zenith — Midday</h3>
      <div class="practice-list">${practiceItems(["earthing"])}</div>
      ${varesCard(VARESSENCE.zenith)}
    </div>

    <div class="result-card">
      <h3>Astral — ${time === "30" ? "Full Wind-Down" : "Essential Core"}</h3>
      <div class="practice-list">${practiceItems(eveSet)}</div>
      ${varesCard(VARESSENCE.astral)}
    </div>

    ${weeklySet.length ? `<div class="result-card">
      <h3>Weekly and Monthly Ceremonies</h3>
      <div class="practice-list">${practiceItems(weeklySet)}</div>
    </div>` : ""}

    <div class="result-card">
      <h3>Meals</h3>
      <p class="lead">If you only have a few minutes around food, the Dining Varessence stands on its own — usable at breakfast, lunch, or dinner.</p>
      ${varesCard(VARESSENCE.dining)}
    </div>

    <div class="result-card">
      <h3>Go Deeper</h3>
      <div class="link-grid">
        <div class="link-row"><span>Haligric Rituals (full book)</span><div class="link-btns"><a href="${A.ritualsBook}" download>Download</a><a href="${A.ritualsBook}" target="_blank" rel="noopener">View</a></div></div>
        <div class="link-row"><span>Haligric Well-Being (full book)</span><div class="link-btns"><a href="${A.wellBeingBook}" download>Download</a><a href="${A.wellBeingBook}" target="_blank" rel="noopener">View</a></div></div>
        <div class="link-row"><span>Haligricity — A Philosophy</span><div class="link-btns"><a href="${A.philosophyBook}" download>Download</a><a href="${A.philosophyBook}" target="_blank" rel="noopener">View</a></div></div>
        <div class="link-row"><span>Mudra Finder Quiz</span><div class="link-btns"><a href="${A.mudraFinder}" target="_blank" rel="noopener">Open</a></div></div>
        <div class="link-row"><span>Pranayama Finder Quiz</span><div class="link-btns"><a href="${A.pranayamaFinder}" target="_blank" rel="noopener">Open</a></div></div>
        <div class="link-row"><span>Sage Goddess Altar Blessing</span><div class="link-btns"><a href="${A.sageBlessing}" target="_blank" rel="noopener">View</a><a href="${A.sageBlessing}" download>Download</a></div></div>
      </div>
    </div>

    <div class="result-card" style="background:rgba(201,162,39,0.04); border-color:rgba(201,162,39,0.2);">
      <h3>A Note from Haligricity</h3>
      <p class="lead">This is your starting point, not your ceiling. Begin with one or two practices and let them become automatic before adding the next.</p>
      <p class="lead">When your season changes — a move, a loss, a new relationship, a new creative direction — come back and retake this quiz. It is a living practice, not a fixed prescription.</p>
      <p class="lead">Grand Rising. Be More You. Ashe.</p>
    </div>

    <div class="retake-row">
      <button class="btn-retake" onclick="restartQuiz()">Retake the Quiz</button>
      <button class="btn-retake" onclick="window.print()">Save My Path</button>
    </div>`;
}

/* ══════════════════════════════════════════════════════════════
   INIT
   ══════════════════════════════════════════════════════════════ */
renderQuestion("time");
</script>
