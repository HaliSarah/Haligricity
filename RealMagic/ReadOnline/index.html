/* FLIPBOOK */

.book-controls { display:flex; gap:10px; justify-content:center; align-items:center; margin:14px 0; flex-wrap:wrap; }

.flip-btn:hover { background:#6B2090; }
.flip-btn:disabled { background:#ccc; cursor:default; }
.page-label { font-family:'Cinzel',serif; font-size:.72rem; letter-spacing:.1em; color:#6B6B6B; min-width:120px; text-align:center; }
.book-spread { display:flex; gap:0; justify-content:center; align-items:stretch; box-shadow:0 8px 40px rgba(74,16,96,.18); border-radius:4px; overflow:hidden; background:#fff; border:1px solid #c9a227; }
.page-side { flex:1; min-height:500px; display:flex; align-items:center; justify-content:center; position:relative; background:#fff; }
.page-side.left { border-right:2px solid #EDE0F5; }
.page-side canvas { width:100%; height:100%; display:block; }
.blank-page { width:100%; height:100%; min-height:500px; background:#fff; display:flex; align-items:center; justify-content:center; }
.blank-page span { font-family:'Cinzel',serif; font-size:.65rem; letter-spacing:.15em; color:#EDE0F5; text-transform:uppercase; }
.page-num-badge { position:absolute; bottom:12px; font-family:'Cinzel',serif; font-size:.6rem; letter-spacing:.1em; color:#c9a227; }
.page-num-badge.left { left:12px; }
.page-num-badge.right { right:12px; }
@media(max-width:600px) { .book-spread { flex-direction:column; } .page-side.left { border-right:none; border-bottom:2px solid #EDE0F5; } }
</style>

  <div class="book-controls">
    <button class="flip-btn" id="btn-first" onclick="goFirst()">⏮ First</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

var pdfDoc = null, totalPages = 0;
// spread = index of the left page. 0 = blank+p1, 2 = p2+p3, etc.
// spread 0: left=blank, right=page 1
// spread N*2: left=page N*2, right=page N*2+1 (or blank if past end)
var spread = 0;

var LC = document.getElementById('left-canvas');
var RC = document.getElementById('right-canvas');
var LB = document.getElementById('left-blank');
var RB = document.getElementById('right-blank');
var ctxL = LC.getContext('2d');
var ctxR = RC.getContext('2d');

pdfjsLib.getDocument({
    url: 'https://Haligricity.IQProductionz.com/RealMagic/RealMagicSingleFlip.pdf',
    cMapUrl: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/cmaps/',
    cMapPacked: true,
    withCredentials: false,
    disableRange: false,
    disableStream: false,
  }).promise.then(function(pdf) {
  pdfDoc = pdf;
  totalPages = pdf.numPages;
  renderSpread(0);
}).catch(function() {
  document.querySelector('.book-wrap').innerHTML = '<iframe src="https://Haligricity.IQProductionz.com/RealMagic/RealMagicSingleFlip.pdf" style="width:100%;height:80vh;border:1px solid #c9a227;border-radius:4px;" title="Real Magic: An Introduction"></iframe><p style="text-align:center;margin-top:12px;"><a href="https://Haligricity.IQProductionz.com/RealMagic/RealMagicSingleFlip.pdf" target="_blank" style="font-family:Cinzel,serif;font-size:.68rem;color:#4A1060;">↗ Open in New Tab</a></p>';
});

function scale(canvas, page) {
  var side = canvas.parentElement;
  var w = side.clientWidth || 400;
  var vp0 = page.getViewport({scale:1});
  var sc = w / vp0.width;
  return page.getViewport({scale: Math.min(sc, 2)});
}

function renderToCanvas(canvas, ctx, pageNum, badge, blankEl) {
  if (pageNum < 1 || pageNum > totalPages) {
    canvas.style.display = 'none';
    blankEl.style.display = 'flex';
    badge.textContent = '';
    return Promise.resolve();
  }
  return pdfDoc.getPage(pageNum).then(function(page) {
    var vp = scale(canvas, page);
    canvas.width  = vp.width;
    canvas.height = vp.height;
    canvas.style.display = 'block';
    blankEl.style.display = 'none';
    badge.textContent = pageNum;
    return page.render({canvasContext:ctx, viewport:vp}).promise;
  });
}

function renderSpread(s) {
  spread = s;
  // spread 0: left=blank(0), right=page 1
  // spread 2: left=page2, right=page3 ...
  var leftPage  = (spread === 0) ? 0 : spread;
  var rightPage = (spread === 0) ? 1 : spread + 1;

  // Last spread: if totalPages is odd, last right is blank
  renderToCanvas(LC, ctxL, leftPage,  document.getElementById('left-badge'),  LB);
  renderToCanvas(RC, ctxR, rightPage, document.getElementById('right-badge'), RB);

  var label = spread === 0
    ? 'Cover'
    : 'Pages ' + leftPage + (rightPage <= totalPages ? '–' + rightPage : '');
  document.getElementById('page-label').textContent   = label;
  document.getElementById('page-label-2').textContent = label;
  document.getElementById('btn-prev').disabled  = (spread <= 0);
  document.getElementById('btn-first').disabled = (spread <= 0);
  document.getElementById('btn-next').disabled  = (spread >= maxSpread());
  document.getElementById('btn-last').disabled  = (spread >= maxSpread());
}

function maxSpread() {
  // last spread: if total is even, last spread = totalPages-1; if odd = totalPages
  return totalPages % 2 === 0 ? totalPages - 1 : totalPages;
}
function flipNext()  { if (spread < maxSpread()) renderSpread(spread === 0 ? 2 : spread + 2); }
function flipPrev()  { if (spread > 0) renderSpread(spread <= 2 ? 0 : spread - 2); }
function goFirst()   { renderSpread(0); }
function goLast()    { renderSpread(maxSpread() % 2 === 0 ? maxSpread() - 1 : maxSpread()); }

document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowRight') flipNext();
  if (e.key === 'ArrowLeft')  flipPrev();
});
</script>
